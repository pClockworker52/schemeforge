arena: contact
slot: medium
lens: structure preservation
statement: >-
  Add to neo_hooke_iv, at the same gamma, a term that is identically zero, with its stress and tangent, on every state
  that a layer between two ideal frictionless surfaces passes through. The term acts only on in-plane biaxial
  compression:
  psi = psi_IV(C; gamma) + 100 gamma K <q>_+^3, with q = 2 - I1 + I3 = (1 - c1)(1 - c2), active only where I1 < 3.
  Here I1 = tr C, I3 = det C, C33 = 1, c1 and c2 are the in-plane eigenvalues of C, and K = lmbda + 2 mu / 3. The term
  needs no eigenvalues or square roots.
  The I1 < 3 switch only separates biaxial compression from biaxial tension (both have q > 0). The two regions meet
  only at rest, where q = 0, so the switch never acts on a nonzero term.
  Claim: GF, SF and C1 are unchanged from IV, so D1, D6 and D7 cannot move, and sliding converges where IV fails.
  This is a component, not a full Target D candidate. It does not address D4 (IV HF |a_err| 0.0488,
  r-20261125-180441-89cc) and makes no claim on HF max_step.
mechanism: >-
  Structure: a medium layer between two frictionless surfaces deforms as F = R [[1 + e, k], [0, s]]. Here s is the
  closure, k the tangential slip over the reference thickness and e the lateral strain of the body surface. For e = 0,
  c1 c2 = s^2 and c1 + c2 = 1 + k^2 + s^2, so q = (1 - c1)(1 - c2) = -k^2 <= 0. Conversely, every pair (c1, c2) with
  c1 c2 <= 1 and q <= 0 is reached by some (s, k). The ideal-contact kinematics therefore fill exactly the region
  q <= 0. An isotropic term in C that vanishes to second order on q <= 0 is invisible to closure and slip. On that
  region only biaxial compression (both stretches < 1) and biaxial tension remain, and this term takes the first.
  It is the analogue of a well-balanced scheme: exact on the states the ideal solution passes through, active only off
  them.

  Consequences by construction:
  - C0a, C1 and GF are confined uniaxial closure with c1 = 1 exactly, so q = 0 up to round-off.
  - C0b and SF are simple shear, where q = -k^2 < 0.
  - In all of these the term, its stress and its tangent vanish. The cube is chosen so that the tangent also vanishes
    on q = 0, because C0a states lie exactly on that boundary.
  - <q>_+ <= 1, so the term is bounded by 100 gamma K. It never acts as a barrier and cannot set the residual gap.
  - At small strain it is O(eps^6), so the rest tangent and the leak are unchanged.

  Where it acts: wherever the medium is pushed sideways while it closes. The clearest case is ahead of a sliding body
  (ploughing, fn_rise in C4), where the neo-Hookean media resist with gamma mu only. IV does not converge on dev
  C4-g6 (r-20261127-201150-ea67) and has SL converged 0.5 on promo (r-20261125-180441-89cc).

  Caveat, stated before the test: in the Hertz residual layer the body's tangential surface displacement shears the
  layer, so q is about -k^2 - 2e and is probably negative. The term may then be almost inert on C2/HF. That is why
  HF max_step is not claimed.

  Paired hunch: d7_tension_only_fibres adds stiffness only in the opposite mode (a tensile principal stretch) on the
  same base. Together they discriminate which mode makes IV fail in sliding.

  Not a gamma rescaling: GF and SF equal IV at the same gamma. IV converges on SL only at x10 (SL conv 1), where its
  GF gap_res is 0.0109 and fails D1 (r-20261125-181303-cca0). A point with IV's GF gap_res 0.00279 and SL conv 1 is
  therefore off IV's gamma line. The other members differ in GF already at gamma (Target D table).
