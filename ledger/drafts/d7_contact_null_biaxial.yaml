kill_criterion: >-
  The dev runs are on contact-v1.0, the promo runs against Target D.
  The hunch is refuted if any of the following holds:
  (a) dev C4-g6 does not converge (IV does not either, r-20261127-201150-ea67);
  (b) C4-g6 converges but its shear_parasitic is > 0.0622 (the dev D8 screen, from faltus2026 r-20261127-201026-a6a1);
  (c) C2-g5 or C2-g6 stops converging (IV converges on both, r-20261127-201150-ea67);
  (d) the promo SL converged mean is < 1.0 (IV 0.5, r-20261125-180441-89cc).
  It is refuted as inert if every dev metric equals IV's (r-20261127-201150-ea67) to 1e-6 relative.
  The test is invalid (an implementation error, not a verdict) if any C0a, C0b or C1 metric differs from IV's by more
  than 1e-8 relative. The term must vanish there identically.
known_relatives:
  - "Closest: Wriggers, Schroeder and Schwarz (2013, Comput. Mech. 52:837-847, doi 10.1007/s00466-013-0848-5): anisotropic third-medium term along the eigenvector of the smallest principal stretch, activated near contact (zoo wriggers2013, as felupe ex20 implements it; paper read via abstract and secondary sources only). Differs by: Wriggers' term acts ON the closure mode (it stiffens the smallest stretch and so sets the residual gap); this term vanishes identically on closure and slip and acts only when both in-plane stretches are compressed."
  - "Miehe, Welschinger and Hofacker (2010, IJNME 83:1273): spectral split of the energy by the sign of the principal strains, used with third-medium contact for phase-field fracture in arXiv 2603.15635 (snippet). Differs by: that split separates tensile from compressive principal strains; here the product of the two compressive parts is penalised, which is zero whenever one stretch is not compressed."
  - "Faltus, Amato and Horak (2026, arXiv 2603.13063), Eq. (1)-(2) (zoo faltus2026): the squared isochoric term stiffens closure, shear and biaxial compression alike."
  - "Bluhm, Sigmund and Poulios (2021, Comput. Mech. 67:1099, arXiv 2010.14277) HuHu, and Frederiksen et al. (2025) HuHu-LuLu (the judge's fixed kr): regularizations of gradients of the deformation, not a pointwise deformation mode."
  - "Li, Kaufman and Jiang (2021, C-IPC, arXiv 2012.04457): C2 strain-limiting barriers on principal stretches (snippet). Differs by: no limit value; one-sided on joint compression; bounded."
  - "The searches found no published third-medium term with this null-set property. Absence of a hit is not evidence of novelty. The label is at most 'variant of a principal-stretch medium term (Wriggers 2013 family)'; only the referee assigns 'plausibly new'."
