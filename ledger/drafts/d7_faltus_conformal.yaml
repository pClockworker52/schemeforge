arena: contact
slot: medium
lens: practitioner
statement: >-
  Keep the robust published medium and remove the part of it that leaves the gap. This is faltus2026 with its
  isochoric invariant J^(-2/3) I1 - 3 replaced by the in-plane conformal distortion
  d = I1 - 1 - 2J = (lambda1 - lambda2)^2, where lambda1 and lambda2 are the in-plane principal stretches, C33 = 1 and
  J = sqrt(det C):
  psi = kappa/2 ln^2 J + kappa/2 (I1 - 1 - 2J)^2, kappa = gamma (lmbda + 2 mu / 3).
  d is smooth in C and needs no eigenvalues.
  In simple shear (J = 1) d equals I1 - 3, so C0b and SF are identical to faltus2026. Along closure, d = (1 - s)^2 is
  bounded, so the barrier is ln^2 J alone (log, like neo_hooke).
  Claim: faltus2026's robustness (HF and HX max_step 1, SL converged) is kept, and GF gap_res falls about 30x, to
  within D1. This is a known method modified: the label is at most 'variant of faltus2026'.
mechanism: >-
  Diagnosis, from the zoo numbers. faltus2026 is the only robust and accurate zoo point (HF and HX max_step 1, SL
  converged 1), but its GF gap_res is 0.034, ten times D1 (r-20261125-180442-ceee). The gap comes from the isochoric
  term. Along confined closure F = diag(1, s, 1), J^(-2/3) I1 grows like 2 s^(-2/3), so the squared term behaves like
  s^(-4/3) and its stress like s^(-7/3). This sets s* ~ gamma^(3/7): dev C0a gap_res 0.162 / 0.029 / 0.0113 at
  gamma 1e-3 / 1e-5 / 1e-6 (r-20261127-201026-a6a1).
  The J^(-2/3) normalisation is 3D: in plane strain the out-of-plane stretch 1 counts as distortion when the in-plane
  area collapses. Faltus, Horak, Doskar and Rokos (2024) state this role explicitly: in plane strain "the isochoric term
  alone can act as the contact term".

  The practitioner's fix is to keep a distortion energy with faltus's growth in shear (quartic in the shear amount) but
  make it bounded along closure. d = (lambda1 - lambda2)^2 does both:
  - simple shear k: d = k^2, as Ibar1 - 3;
  - closure: d = (1 - s)^2 <= 1;
  - thin-layer slip F = [[1, k], [0, s]]: d = (1 - s)^2 + k^2, with no s^(-2/3) amplification.
  The closure law becomes kappa ln(1/s)/s plus a bounded term. Hence s* ~ gamma ln(1/s*), as neo_hooke: about 8e-4 at
  dev C0a-g5 against neo's 6.53e-4 (r-20261127-201108-122e).

  The bet: faltus's robustness comes from its large-strain distortion stiffening in shear-like modes, which d keeps,
  and not from the s^(-2/3) coupling to closure, which d removes. The kill criterion tests exactly this. It also
  removes most of faltus's sliding drag: dev C4-g6 shear_parasitic is 0.0622 (r-20261127-201026-a6a1), and in a thin
  sheared layer the s^(-2/3)-amplified term dominates that drag.

  D7 at zero margin: SF is identical to faltus2026, so SF shear_parasitic equals D7's threshold (0.00384,
  r-20261125-180442-ceee). If the promo check is not met at equality, a follow-up variant scales the distortion term by
  0.9. That variant is not part of this hunch.
  D4 is uncertain. Lower moderate-compression stiffness cuts the leak, so C2-g5 a_err falls from +0.144. At C2-g6 it
  may go negative, as for neo (-0.039, r-20261127-201108-122e).

  Not a gamma rescaling: faltus2026 reaches a GF gap_res near D1 only at x0.01 (0.00505, still failing), where HF
  max_step is 0.5 and HX 0.167 (r-20261125-181302-40b2). The closure exponent changes from 7/3 to log, which no
  constant factor on gamma can do.
