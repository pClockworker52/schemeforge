kill_criterion: >-
  The dev runs are on contact-v1.0, the promo runs against Target D.
  The hunch is refuted if any of the following holds:
  (a) dev C2-g5, C2-g6 or C4-g6 does not converge (faltus2026 converges on all three, r-20261127-201026-a6a1);
  (b) C2-g6 newton_iters is > 81 (1.3 x faltus2026's 62, r-20261127-201026-a6a1);
  (c) dev C0a-g5 gap_res is > 0.0029 (the dev D1 screen);
  (d) the promo HF max_step median is < 1, HX max_step is < 1, or SL converged is < 1 (faltus2026 1 / 1 / 1,
  r-20261125-180442-ceee).
  Reading of the outcomes: (a), (b) or (d) means faltus2026's robustness lives in its J^(-2/3) coupling to closure. If
  the candidate is robust but HF |a_err| median is > 0.02, the hunch is supported for D1, D3 and D8, with D4 open.
known_relatives:
  - "Closest: Faltus, Horak, Doskar and Rokos (2024, arXiv 2405.01185), Eq. 12, and Faltus, Amato and Horak (2026, arXiv 2603.13063), Eq. (1)-(2) (zoo faltus2026): ln^2 J plus the isochoric invariant J^(-2/3) I1 - 3 (squared in 2026). The 2024 paper says the isochoric part alone is the contact term in plane strain because it approaches infinity under in-plane compression. Differs by: that invariant is replaced by the in-plane conformal distortion I1 - 1 - 2J = (lambda1 - lambda2)^2, bounded along closure, so the barrier is ln^2 J alone; identical in simple shear."
  - "Levy, Petitjean, Ray and Maillot (2002, SIGGRAPH, Least Squares Conformal Maps): the same invariant (||F||^2 - 2 det F in 2D, zero for similarities) as a mesh-parameterisation energy. Its normalisation was not checked against the paper."
  - "Bluhm, Sigmund and Poulios (2021, Comput. Mech. 67:1099, arXiv 2010.14277), zoo neo_hooke: shares the log closure barrier, but has a quadratic, not quartic, distortion energy."
  - "Label: 'variant of faltus2026'. Not claimed novel; only the referee assigns 'plausibly new'."
