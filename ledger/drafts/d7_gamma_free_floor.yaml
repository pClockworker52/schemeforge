arena: contact
slot: medium
lens: approximation theory
statement: >-
  Split the two error terms of the medium into two parameters. The far field stays the gamma-scaled neo_hooke. A
  steep volumetric wall is added whose position does not depend on gamma:
  psi = psi_neo(C; gamma) + mu J_w^6 phi_6(J), with phi_n(J) = (J^-n - 1)/n + J - 1, n = 6 and J_w = 4.3e-4.
  With these constants the wall carries 0.05 mu at J = 2e-3. phi_n is convex, >= 0, and zero with zero slope at
  J = 1. The wall is proportional to mu, so unit scaling is exact, and it is finite for every J > 0.
  Claim: at the HF gammas (1e-6..1e-5) the residual layer is held near 2e-3 of the gap instead of neo's 1e-4..7e-4.
  This bounds the layer's thinness and tangent independently of gamma, and HF and SL converge in one load step. Where
  neo's own residual gap exceeds the wall, at gamma >= about 3e-5, the candidate is neo_hooke.
  D4 is not addressed: neo HF |a_err| is 0.0474 (r-20261125-180441-78df).
mechanism: >-
  Approximation view. A third medium approximates the hard-contact law (zero stress while open, a wall at zero
  thickness) with two error terms:
  - the far-field error: leak and load carried through the open gap, set by the response at moderate compression and
    O(gamma);
  - the near-wall error: residual thickness s*, set where the wall stress reaches the body stress sigma.
  Every zoo member is psi = gamma f(C), a one-parameter family with a fixed shape. Both errors therefore move together
  along gamma, and that is the front:
  - neo: s* ~ gamma ln(1/s*), dev C0a gap_res 6.53e-4 at 1e-5 and 8.23e-5 at 1e-6 (r-20261127-201108-122e);
  - faltus2026: s* ~ gamma^(3/7), 0.029 and 0.0113 (r-20261127-201026-a6a1);
  - wriggers2013: s* ~ gamma^(1/5), 0.0384 and 0.0244 (r-20261127-201235-b2b2).

  A second, gamma-free parameter decouples the two. The wall's own residual thickness is
  s_w ~ J_w^(6/7) (mu/sigma)^(1/7). The 1/7 power makes it insensitive to the load: about 1.3e-3 to 2e-3 of the gap
  over the GF and HF stress ranges. Below s_w the tangent of the layer is bounded by about 7 sigma / (g s_w),
  independent of gamma. The neo-Hookean media instead get thinner, and their tangent stiffer, without bound as gamma
  falls; they fail at gamma = 1e-7 (contact_baseline.md). Above s_w the wall is negligible: P_wall(J = 0.5) is about
  1e-18 mu. The far field, leak_pre and SF are therefore neo's at the same gamma.

  Evidence against, stated before the test: thickness alone does not make a zoo medium robust.
  - faltus2026 x0.1 has GF gap_res 0.0133 but HF max_step 0.5 (r-20261125-181302-4d4e).
  - neo_hooke x10 has a thinner gap, 0.00745, and HF max_step 1 (r-20261125-181302-d6e0).
  The hunch bets that, for the neo-Hookean shape specifically, the small-gamma failure is near-wall conditioning, not
  missing moderate-strain stiffness. A refutation says the latter.

  Trap check: J_w is chosen from D1's threshold (the floor sits below 0.0034). That is a design requirement, not a fit
  to held-out ranges. The floor does not vary with gamma or with any case parameter.

  Not a gamma rescaling: the candidate equals neo at large gamma and has a fixed-thickness wall at small gamma. To
  reach a 2e-3 gap at gamma = 1e-6, neo would need roughly x25. At x10 its GF leak_pre is already 0.00284 and fails D6
  (r-20261125-181302-d6e0). The candidate's leak equals neo's at gamma (GF 0.000285, r-20261125-180441-78df).
