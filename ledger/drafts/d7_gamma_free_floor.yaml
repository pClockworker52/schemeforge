kill_criterion: >-
  The dev runs are on contact-v1.0, the promo runs against Target D.
  The hunch is refuted if any of the following holds:
  (a) dev C2-g5 or C2-g6 does not converge, or C2-g6 newton_iters is >= 87 (neo, r-20261127-201108-122e);
  (b) dev C4-g6 does not converge (neo does not, r-20261127-201108-122e);
  (c) dev C0a-g5 gap_res is > 0.0029 (the dev D1 screen, from faltus2026 r-20261127-201026-a6a1);
  (d) the promo HF max_step median is <= 0.375 (neo, r-20261125-180441-78df);
  (e) the promo GF gap_res median is > 0.0034 (D1).
  The test is invalid (implementation error) if C0a-g3 or C0b-s2 differs from neo (r-20261127-201108-122e) by more
  than 1e-6 relative. The wall must be inactive there.
known_relatives:
  - "Closest: Li, Kaufman and Jiang (2021, Codimensional IPC, ACM TOG 40(4), arXiv 2012.04457): a distance offset that keeps mid-surfaces at least a thickness apart, enforced by a barrier (snippet). Differs by: there is no distance; the floor acts on the volume ratio J of a continuum medium as a smooth power wall that stays finite below J_w. Its position is fixed while the far field scales with gamma."
  - "Wriggers, Schroeder and Schwarz (2013, Comput. Mech. 52:837) as in felupe ex20 (zoo wriggers2013): a steep (s^-5) near-wall term, but scaled by gamma, so its thickness moves as gamma^(1/5) (dev C0a-g5 0.0384, r-20261127-201235-b2b2)."
  - "Polyak (1992, Math. Programming 54:177), modified (shifted) barrier functions: a barrier whose singularity is shifted away from the constraint boundary."
  - "Prager (1957) ideal locking materials: rigid beyond a locking strain. Differs by: smooth power wall, no hard lock."
  - "Faltus, Amato and Horak (2026, arXiv 2603.13063): a linear-elastic term enforcing constant medium stiffness, gamma-scaled and needing F. It is a stiffness add-on, not a floor."
  - "Label at most 'variant of an offset or shifted barrier'. Not claimed novel; only the referee assigns 'plausibly new'."
