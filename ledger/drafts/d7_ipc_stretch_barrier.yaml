kill_criterion: >-
  The dev runs are on contact-v1.0, the promo runs against Target D.
  The hunch is refuted if any of the following holds:
  (a) dev C2-g5 or C2-g6 does not converge, or C2-g6 newton_iters is >= 87 (neo_hooke, r-20261127-201108-122e);
  (b) dev C4-g6 does not converge (neo_hooke does not, r-20261127-201108-122e);
  (c) dev C0a-g5 gap_res is > 0.0029 (the dev D1 screen, from faltus2026 r-20261127-201026-a6a1);
  (d) the promo HF max_step median is <= 0.375 (neo_hooke, r-20261125-180441-78df), or the GF gap_res median is
  > 0.0034 (D1).
  The test is invalid (implementation error) if C0a-g5 leak_pre or C0b-s2 differs from neo_hooke
  (r-20261127-201108-122e) by more than 1e-8 relative. The barrier must be inactive there.
known_relatives:
  - "Closest: Li, Ferguson, Schneider, Langlois, Zorin, Panozzo, Jiang and Kaufman (2020, Incremental Potential Contact, ACM TOG 39(4)): the clamped barrier b(d) = -(d - d_hat)^2 ln(d / d_hat), C2 at d_hat; technical supplement: C0/C1 clampings fail Newton (snippet). Differs by: the argument is a principal stretch of a continuum medium at each quadrature point; no distances and no line search; added to a gamma-scaled neo-Hooke."
  - "Wriggers, Schroeder and Schwarz (2013, Comput. Mech. 52:837), as in felupe ex20 (zoo wriggers2013): activation on the smallest principal stretch below tol = 0.5 with (1 - lambda)^24 / lambda^2. Differs by: log barrier (s^-1 instead of s^-5 near the wall), C2 clamping, a symmetric sum over both stretches, and activation at 0.25, below SF's smallest stretch."
  - "Li, Kaufman and Jiang (2021, C-IPC, arXiv 2012.04457): C2 constitutive barrier for strain limiting on principal stretches (snippet)."
  - "Interior-point log barriers (Nesterov and Nemirovski 1994): the source of the 1/s law; their path-following corresponds to load stepping, which the slot cannot use."
  - "Label at most 'variant of Wriggers 2013 with the IPC barrier'. Not claimed novel; only the referee assigns 'plausibly new'."
