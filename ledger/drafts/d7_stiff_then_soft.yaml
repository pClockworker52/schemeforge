kill_criterion: >-
  The dev runs are on contact-v1.0, the promo runs against Target D.
  The hunch is refuted if any of the following holds:
  (a) any dev case that neo_hooke converges (C0a-g3/g5/g6, C1, C2-g5, C2-g6; r-20261127-201108-122e) does not converge.
  This refutes the contrarian premise that the non-convex band is tolerated;
  (b) C2-g6 newton_iters is >= 87 (neo_hooke, r-20261127-201108-122e);
  (c) dev C4-g6 does not converge;
  (d) on promo, the HF max_step median is <= 0.375 (neo_hooke, r-20261125-180441-78df), or GF converged or SL
  converged is < 1.
  (b), (c) or (d) without (a) refutes the small-strain-stiffness premise. The verdict note records which premise
  failed.
known_relatives:
  - "Closest: the exponential cohesive law of Xu and Needleman (1993, Model. Simul. Mater. Sci. Eng.), built on the universal binding-energy relation of Rose, Smith and Ferrante: an energy that is stiff at small opening, softens, and saturates. Differs by: used in compression of a fictitious contact medium, in ln J, on top of a monotone barrier that carries the final state."
  - "Non-convex foam energies: Gioia, Wang and Cuitino (2001, Proc. R. Soc. A) and Pampolini and Del Piero (2008, J. Mech. Mater. Struct. 3:969; snippet). Double-well energies give localisation and the plateau of open-cell foams. Differs by: here the softening sits at 1-5 % volume change to give a stiff linearisation, not to model a plateau."
  - "Wang, Lazarov, Sigmund and Jensen (2014, CMAME), energy interpolation for fictitious-domain void elements: linear behaviour of low-stiffness regions to avoid excessive distortion. Differs by: needs F (linear strain); here C only, and the extra stiffness is switched off by saturation."
  - "Faltus, Amato and Horak (2026, arXiv 2603.13063): a linear-elastic term for constant third-medium stiffness. It needs F and keeps its stiffness at all strains."
  - "Zoo neo_hooke at x100 (r-20261125-181302-bb9d) is the small-strain reference point."
  - "No third-medium paper with a non-convex medium energy was found. Label at most 'variant of an exponential cohesive energy used in compression'; only the referee assigns 'plausibly new'."
