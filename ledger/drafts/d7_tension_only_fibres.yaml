arena: contact
slot: medium
lens: transfer
statement: >-
  Transfer from cartilage mechanics, where fibres bear tension only. Add to neo_hooke_iv at gamma a tension-only
  ("fibre") term on the in-plane principal stretches:
  psi = psi_IV(C; gamma) + 5 gamma mu sum_i <lambda_i - 1>_+^2, with lambda_i = sqrt(c_i) for the in-plane eigenvalues
  of C. Use the closed form with the safe square root of wriggers2013, and jnp.where for the bracket.
  The term is zero for every compressed or unstretched direction, so confined closure (C0a, C1, GF; stretches 1 and s)
  is untouched. It acts wherever a direction of the medium is stretched: simple shear, slip of the thin layer, and
  lateral squeeze-out at the contact edge.
  Claim: HF and SL become robust at IV's tightness, with SF parasitic shear about 6 gamma, inside D7. D4 is not
  addressed: IV HF |a_err| is 0.0488 (r-20261125-180441-89cc).
mechanism: >-
  Transfer.
  - Cartilage resists tension far more than compression. Conewise linear elasticity (Curnier et al. 1995; Soltz and
    Ateshian 2000) and continuous tension-only fibre distributions (Ateshian et al. 2009) make the stiffness switch
    with the sign of the stretch along each direction. Reduced to principal directions, this is the term above.
  - Medium version: closing a gap only compresses (the stretches are 1 and s). Every way the medium can be dragged out
    of shape near a contact has a tensile principal stretch: a thin layer slipping by k has lambda1 about sqrt(1 + k^2),
    and medium squeezed sideways out of a closing gap has a lateral stretch > 1. A tension-only term therefore resists
    these modes at (1 + 5) gamma mu and leaves the closure law, and with it gap_res and leak_pre, exactly IV's.

  The hypothesis is that IV fails C4-g6 (dev, not converged, r-20261127-201150-ea67) and is not robust in one load step
  (HF max_step 0.5, SL converged 0.5, r-20261125-180441-89cc) because medium near the contact edge is dragged with only
  gamma mu resistance. faltus2026 is robust (r-20261125-180442-ceee) and stiffens strongly in these modes.

  Smoothness: the bracket is C1 at lambda = 1, the conewise-linear structure, so the tangent has a direction-dependent
  jump at rest. On C0a the jump cannot act: the stretched direction there is x, whose dofs are fixed. Elsewhere it may
  cost Newton iterations, which kill clause (b) measures.

  D7 budget: in simple shear k, P_xy/(mu k) rises from gamma to about 7 gamma at k = 2 and 6.3 gamma at k = 1.5,
  computed from the formula. The D7 threshold is about 15 x neo's SF median (0.00384 vs 0.000247,
  r-20261125-180442-ceee and r-20261125-180441-78df). At B-0063 (s = 3) the term gives about 8 gamma, against
  faltus2026's 170 gamma (r-20261127-194154-e410).

  Paired with d7_contact_null_biaxial, which adds stiffness only in the opposite mode (both stretches compressed) on the
  same base. The pair tells which mode makes IV fail.

  Not a gamma rescaling: GF is IV's at gamma (gap_res 0.00279, r-20261125-180441-89cc). IV reaches HF max_step 1 and
  SL converged 1 only at x10, where its GF gap_res is 0.0109 (r-20261125-181303-cca0).
