kill_criterion: >-
  The dev runs are on contact-v1.0, the promo runs against Target D.
  The hunch is refuted if any of the following holds:
  (a) dev C4-g6 does not converge (IV does not, r-20261127-201150-ea67), or C2-g5 or C2-g6 stops converging;
  (b) C2-g6 newton_iters is >= 76 (IV, r-20261127-201150-ea67);
  (c) C0b-s2 shear_parasitic is > 1.74e-4 (the dev D7 screen, from faltus2026 r-20261127-201026-a6a1);
  (d) on promo, the HF max_step median is <= 0.5 or SL converged is < 1 (IV 0.5 / 0.5, r-20261125-180441-89cc), or
  the SF shear_parasitic median is > 0.00384 (D7).
  The test is invalid (implementation error) if any C0a or C1 metric differs from IV's by more than 1e-8 relative.
known_relatives:
  - "Closest: Ateshian, Rajan, Chahine, Canal and Hung (2009, J. Biomech. Eng.): cartilage solid matrix with a continuous fibre distribution whose fibres bear tension only (snippet). Also the conewise linear elasticity of Curnier, He and Zysset (1995, J. Elasticity) and Soltz and Ateshian (2000), where stiffness switches with the sign of the strain along a texture direction. Differs by: used as a stabiliser of a fictitious contact medium, reduced to the two in-plane principal stretches, with no compressive part, so that the closure law stays the base medium's."
  - "Miehe, Welschinger and Hofacker (2010, IJNME 83:1273), spectral split by the sign of principal strains (used with third-medium contact in arXiv 2603.15635, snippet). Differs by: here a tensile part is added on top of an unsplit medium, not degraded."
  - "Wriggers, Schroeder and Schwarz (2013, Comput. Mech. 52:837), zoo wriggers2013: a principal-stretch term on the compressed direction, the opposite side."
  - "Li, Kaufman and Jiang (2021, C-IPC, arXiv 2012.04457): barriers limiting stretch from above (snippet). Differs by: a quadratic penalty, with no limit value."
  - "Bluhm, Sigmund and Poulios (2021, arXiv 2010.14277) HuHu, and Frederiksen et al. (2025) HuHu-LuLu: gradient regularizations, the judge's fixed kr."
  - "Label at most 'variant of conewise or tension-only fibre elasticity'. Not claimed novel; only the referee assigns 'plausibly new'."
