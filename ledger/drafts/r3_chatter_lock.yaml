kill_criterion: >-
  Refuted if no point of the grid lambda in {0.7, 0.9}, S* in {2, 4}, mu in {0.1, 0.3} reaches N5 = N6 = 1 explicit on
  dev. Also refuted if every point that does reach it loses more than 0.3 cell of R1 contact width against
  thinc_bvd, has B-0002 order below 1.8, or has fewer Newton-converged N5/N6 back pressures than thinc_bvd. If only a
  lock that never releases (mu = infinity) converges, the release part is refuted and the result is a variant of
  limiter freezing.
known_relatives:
