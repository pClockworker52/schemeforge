arena: euler1d
slot: reconstruction_stateful
lens: transfer
statement: >-
  MOOD's a posteriori admissibility check, carried over into a single-pass scheme with the state as a one-step
  memory, lets WENO5-Z keep its sharpness and smooth accuracy while cutting its shock overshoot to van Leer's level.
  The state stores each cell's previous primitive values. A cell whose current value breaks the relaxed discrete
  maximum principle of its previous 3-cell neighbourhood, and is not a smooth extremum, is reconstructed with a
  dissipative MUSCL for this step.
mechanism: >-
  Transfer from a posteriori limiting (MOOD, Clain, Diot, Loubere 2011; DG subcell limiting, Dumbser et al. 2014).
  An a priori limiter must limit everywhere an oscillation might arise, judged from slope ratios, and so pays
  sharpness at every jump (H-0011). An a posteriori check limits only where a new extremum has actually appeared.
  MOOD recomputes the step; a reconstruction slot cannot. Its state can, however, hold q^(n-1), so the check runs
  one step late: at step n, cell i is troubled in variable q if q_i^n lies outside [min, max] of q_(i-1..i+1)^(n-1)
  by more than delta (max - min) + 1e-12 |q_i| (relaxed DMP). The flag is cleared if the cell passes MOOD's
  smooth-extremum test (u2 detection: the neighbouring second differences have the same sign and their ratio is
  above 1/2). Troubled cells use MUSCL-minmod faces; all others use WENO5-Z. Why one step late is enough: the
  post-shock oscillation of a moving or slowly moving shock builds up over many steps as the shock crosses cells
  (Roberts 1990). Damping each new extremum one step after it appears holds the amplitude near one step's growth,
  not the accumulated one. Stencil: the check for cell k+2 needs the states of cells k+1..k+3 and for cell k+3 those
  of k+2..k+4, all inside the window's (4, 3) state. s_new is the current window value of the cell, and s_rho = 0
  (rho > 0 always) marks no history at the first step. At a converged steady state q^n = q^(n-1), so no cell is
  flagged and the scheme reduces to WENO5-Z: convergence is inherited, not improved.
