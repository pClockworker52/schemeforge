kill_criterion: >-
  Refuted if no delta in {1e-3, 1e-2} gives, on dev, R6 and B-0010 overshoot <= 1.1 x muscl_van_leer's dev values
  while keeping R1 shock width <= 2.7 cells and S1 order >= 1.9. Also refuted if the flagged-cell fallback is what
  does all the work, i.e. a variant that flags every cell next to a jump of more than 5 % gives the same overshoot
  with no worse widths: the a posteriori detection would then add nothing over a jump detector.
known_relatives:
  - MOOD (Clain, Diot, Loubere 2011, J. Comput. Phys. 230); relaxed DMP and u2 smooth-extremum detection (Diot, Loubere, Clain 2013)
  - a posteriori subcell finite-volume limiting of DG (Dumbser, Zanotti, Loubere, Diot 2014, J. Comput. Phys. 278)
  - WENO5-Z (Borges, Carmona, Costa, Don 2008), zoo member weno5z
  - troubled-cell indicators (Qiu and Shu 2005)
  - "One search found no MOOD variant that carries the flag to the next step instead of recomputing; that is not evidence of novelty, and the method is at most a variant of MOOD."
