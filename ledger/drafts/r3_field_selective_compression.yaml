arena: euler1d
slot: reconstruction_stateful
lens: shock physics
statement: >-
  Compressing only the linearly degenerate (entropy) characteristic field, i.e. THINC/BVD on the field-2 amplitude
  and van Leer MUSCL on the two acoustic fields, in local characteristic variables, makes contacts as sharp as
  thinc_bvd's and keeps them sharp on long runs. Shock width, shock overshoot and nozzle convergence stay at the
  level of the acoustic base (van Leer), because contacts do not self-steepen and a steady nozzle flow carries
  almost no field-2 signal.
mechanism: >-
  Contacts are linearly degenerate. No physical compression opposes numerical diffusion there, so their width grows
  with time (van Leer: RF1 contact 7.1 cells, LF1 16.5 cells), and anti-diffusion is the only way to hold them.
  Shocks are genuinely nonlinear. Converging characteristics bound their width independently of time, and extra
  compression in these fields is what made every round-2 candidate sharp enough for A1 overshoot 2-3 x van Leer
  (A7; H-0011) and what drives the limit cycle at the steady shock. So the compression should be applied per wave
  family, not per primitive variable. Recipe: at each cell of the window, project the primitive differences onto
  the left eigenvectors at that cell's state, giving alpha1 = (dp - rho a du) / (2 a^2), alpha2 = drho - dp / a^2 and
  alpha3 = (dp + rho a du) / (2 a^2). Reconstruct alpha2 with THINC/BVD (beta 1.6, as in the zoo member) and alpha1
  and alpha3 with the van Leer limiter, then map the face increments back with the right eigenvectors. A zero
  difference then gives a zero increment, so a constant state comes back exactly. Why convergence should survive:
  in a steady quasi-1D nozzle the flow is isentropic away from the shock, so alpha2 = O(dx^2) there. Across the shock
  the entropy jump is third order in shock strength; for nozzle shock Mach numbers of 1.3-1.6, drho and dp / a^2
  at the mean state nearly cancel. THINC then carries only a small part of the steady shock's jump, the residual map
  near the shock is close to van Leer's, and van Leer does not stall in the way thinc_bvd stalls on N5/N6. Widths
  and overshoots of shocks are measured in p, which has no alpha2 component, so the shock metrics should be van
  Leer's. The candidate is stateless and passes s through unchanged.
