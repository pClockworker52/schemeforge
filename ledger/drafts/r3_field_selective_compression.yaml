  - {metric: LF1.contact_width, direction: down, size: "median <= 8 cells, against van Leer's 16.5 (A8a needs <= 24.75)"}
  - {metric: R1.shock_width, direction: same, size: "within +-0.1 cell of muscl_van_leer's 2.92; A1 is NOT addressed by this mechanism"}
  - {metric: B-0010.overshoot, direction: same, size: "within 10 % of muscl_van_leer's dev value (also R6.overshoot); A7 holds"}
  - {metric: N5.converged_expl, direction: same, size: "equal to muscl_van_leer's dev share (also N6), strictly above thinc_bvd's 1/3 (N5) and 0 (N6) from r-20261022-054308-f275"}
  - {metric: S1.order_smooth, direction: same, size: ">= 1.9 (S1 is a pure entropy wave, so BVD, not THINC, must pick MUSCL there; thinc_bvd 1.96); B-0002.order_smooth >= 1.9"}
kill_criterion: >-
  Refuted if, on dev, every variant (THINC/BVD or THINC-where-monotone on alpha2; beta 1.6 and 2.0) fails at least one
  of the following: R1 contact width <= 4.0 cells; N5 + N6 explicit converged share at least that of muscl_van_leer;
  R6 and B-0010 overshoot <= 1.1 x muscl_van_leer's dev values; S1 order >= 1.9. The claim is also refuted if the
  best dev variant goes to promo and has an LF1 contact width median above 1.5 x van Leer's (A8a). Missing A1 or A3
  does not refute this hunch, because it predicts both stay at van Leer's level; those need another mechanism.
known_relatives:
  - "Known method, stated plainly: THINC only for the contact/entropy wave in characteristic space (Chamarthi, arXiv 2410.22127, 2024) and a hybrid of WENO on genuinely nonlinear fields with BVD on linearly degenerate fields (Zhang and Shen, Adv. Appl. Math. Mech. 2025; read from the abstract only). New here is only the claim that it removes thinc_bvd's steady-state stall, which those papers do not test as far as one search shows."
  - Harten, artificial compression method (1977/1978), including its self-adjusting hybrid form with compression on the linearly degenerate field
  - Yang (1990), artificial compression for ENO schemes (slope modification at contacts)
  - THINC/BVD (Sun, Inaba, Xiao 2016), zoo member thinc_bvd
  - local characteristic reconstruction (Harten, Engquist, Osher, Chakravarthy 1987; Qiu and Shu 2002)
  - PLAN seed hunch 4
