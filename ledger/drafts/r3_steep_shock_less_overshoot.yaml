  - {metric: R1.shock_width, direction: down, size: "<= thinc_bvd's 2.47 (r-20261022-070144-7e03), i.e. <= 2.5 at every beta"}
  - {metric: R1.contact_width, direction: down, size: "<= 2.65 (thinc_bvd) and falling with beta"}
  - {metric: RF2.overshoot, direction: down, size: "p90 <= 1.1 x van Leer's 0.0233 on promo for the best dev beta (A7b)"}
  - {metric: N5.converged_expl, direction: same, size: "stays at thinc_bvd's stall level (1/3, N6 0) or worse; convergence is not addressed"}
  - {metric: S1.order_smooth, direction: down, size: "may fall below 1.9 at beta 3.0 if BVD picks THINC on smooth extrema; reported, not predicted to pass"}
kill_criterion: >-
  Refuted if, on dev and in both sub-families (with and without BVD), the larger of R6 and B-0010 overshoot does not
  fall from beta 1.6 to beta 3.0. Also refuted if no beta gives both overshoots <= 1.1 x muscl_van_leer's dev values
  with R1 shock width <= 2.5 cells. If a dev point passes, the claim is refuted on held-out data when its promo run
  misses A1 (RF1 shock width median <= 2.6) or A7 (RF1 and RF2 overshoot p90 <= 1.1 x van Leer's). A refutation
  extends H-0011's finding from TVD limiters to THINC profiles.
known_relatives:
  - THINC/BVD (Sun, Inaba, Xiao 2016), zoo member thinc_bvd; P4T2-BVD with two THINC steepnesses (arXiv 2106.01872)
  - subcell resolution (Harten 1989)
  - post-shock oscillations of slowly moving shocks (Roberts 1990; Jin and Liu 1996; Arora and Roe 1997; Stiriba and Donat 2003)
  - shock-capturing anomalies and intermediate states off the Hugoniot (Zaide and Roe 2011-2012)
  - H-0011 (sharpness forces overshoot for TVD limiters), the claim this hunch contradicts outside the TVD family
