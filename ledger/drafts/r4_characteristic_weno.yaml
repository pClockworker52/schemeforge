kill_criterion: >-
  Dev (judge v1.5): refuted if characteristic WENO5-Z fails to converge with Newton on N1 or on any N4 point (N4
  converged_impl < 1). Also refuted if its N4 roughness is more than 10 x weno5z's 1.3e-4 (r-20261024-152923-3b0e), or
  if its R1 shock exceeds 2.7 (weno5z 2.56, same run). Promo (judge v1.5): refuted if its ok promo run has NF1
  converged_impl mean < 1.00, NF3 roughness_J p90 > 0.002 or RF1 shock_width median > 2.6. A promo run rejected for a
  positivity violation, after a fallback has been added, leaves the promo part inconclusive. Failing A7 does not refute
  this hunch; it predicts that failure.
known_relatives:
  - "Known method, stated plainly: characteristic-wise WENO5-Z is textbook (Borges, Carmona, Costa, Don 2008; Harten, Engquist, Osher, Chakravarthy 1987; Qiu and Shu 2002); zoo weno5z is its componentwise form. Only its steady nozzle Newton convergence and objective smoothness under this judge are tested"
  - "Zhang and Shu (2007, J. Sci. Comput. 31): a new smoothness indicator for WENO and its effect on convergence to steady state; post-shock oscillations hold the residual"
  - "J. Sci. Comput. follow-up, doi 10.1007/s10915-010-9435-5 (search snippet only, authors not checked): the local characteristic decomposition strongly affects post-shock oscillation"
  - "Zhang and Shen (2025): hybrid WENO on genuinely nonlinear fields and BVD on linearly degenerate fields (from H-0012's relatives; abstract only)"
  - "H-0016 (MOOD on WENO5-Z, refuted)"
