arena: euler1d
slot: reconstruction_stateful
lens: approximation theory
statement: >-
  WENO5-Z in local characteristic variables, on all three fields, stateless with the state passed through, converges
  with Newton on every NF1 nozzle and every NF3 sweep point; componentwise WENO5-Z reaches only NF1 0.65. It therefore
  meets A1, A4 and A5 together (RF1 shock median <= 2.6, NF1 Newton 1.00, NF3 roughness p90 <= 0.002), which refutes
  H-0019. A7b is not expected to hold.
mechanism: >-
  Approximation theory: WENO's nonlinear weights carry out ENO stencil selection. That is justified for a scalar
  function with one isolated jump in the stencil: every substencil that crosses the jump has a smoothness indicator of
  O(jump^2), and its weight goes to about zero.

  Componentwise on (rho, u, p), the three components jump by different relative amounts at the same shock, and each is
  polluted by the waves of the others. Their weights then choose different substencils at the same face, so the face
  state is assembled from different stencils. It does not lie on the shock's Hugoniot locus, and it emits small waves
  in the other two families. Zhang and Shu (2007) showed that these slight post-shock oscillations hold the WENO
  residual at truncation level.

  Here the same effect plausibly makes Newton fail at isolated sweep points: weno5z promo has NF1 converged_impl 0.65
  and NF3 converged_impl worst 0.91 (r-20261024-154023-7489). Its NF3 roughness is low where it converges (median
  4.3e-4); the p90 of 22 is a convergence failure, not a staircase.

  In characteristic variables a steady normal shock is, to leading order in its strength, a jump in the field-1
  amplitude only. Fields 2 and 3 are smooth across the stencil, so their weights relax to the linear weights (fifth
  order). The face state then lies on the field-1 Hugoniot and no spurious waves are emitted. The 2010 follow-up to
  Zhang and Shu reports that the characteristic decomposition affects the post-shock oscillation. In-house support:
  projecting van Leer onto characteristic fields (c-a411e8accb) cut RF1 overshoot p90 from 0.0219 to 0.0066 and NF3
  roughness p90 from 1.8e-3 to 1.5e-5 (r-20261023-232730-c8f5 vs r-20261024-153251-4a12).

  Why A1 should survive: the moving shock width comes from stencil selection on the field that carries the shock
  (componentwise RF1 2.35), and the projection does not widen it.

  Why A7b likely fails: the projection left van Leer's RF2 overshoot unchanged (0.0236 vs 0.0233, same runs), so
  overshoot behind slowly moving shocks is not a cross-field effect. weno5z's RF2 p90 is 0.0696.

  Implementation notes, not part of the mechanism: WENO-Z's EPS = 1e-40 is absolute; on characteristic amplitudes it
  must be made relative to pass the v1.5 scaling constraint. A positivity fallback is needed because the
  back-projection can produce negative face rho or p (traps). The 5-cell stencils fit the 6-cell window, as in the zoo
  weno5z.
