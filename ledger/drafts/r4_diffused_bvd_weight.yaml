kill_criterion: >-
  Dev (judge v1.5): refuted if no kappa in {1, 3} reaches N4 roughness <= 0.002 with N1 and N4 converged_impl = 1 and
  R1 shock <= 2.7. The spreading claim is refuted if the kappa = 0 control (same steep forcing, weight still lagged one
  step, no spreading) is within a factor of 2 of the best kappa >= 1 variant on both N4 and N5 roughness. The reference
  levels for that comparison are c-2ca8842812's dev N4 0.0109 and N5 0.0222 (r-20261023-034337-d53f, v1.4). Promo
  (judge v1.5): refuted if the best dev kappa has an ok promo run with NF3 roughness_J p90 > 0.002, NF1 converged_impl
  mean < 1.00 or RF1 shock_width median > 2.6. A promo run rejected for a hard-constraint violation (positivity; the
  parent needs a fallback per the traps file) leaves the promo part inconclusive.
known_relatives:
  - "Barter and Darmofal (2010, J. Comput. Phys. 229): PDE-based artificial viscosity, a sensor forcing a smoothing equation; Barter's thesis (MIT 2008) on lower sensitivity to shock-grid alignment. Label: variant of PDE-smoothed shock capturing, transferred to a BVD weight"
  - "Persson and Peraire (2006): sub-cell shock capturing with smooth artificial viscosity"
  - "Kloeckner, Warburton, Hesthaven (2011), as cited in arXiv 1810.02152: no observed advantage of viscosity of higher continuity (evidence against)"
  - "JST switch (Jameson, Schmidt, Turkel 1981): the sensor is spread with a max over neighbours"
  - "H-0005 (relaxation of the limiter factor in pseudo-time, refuted; no spatial spreading); H-0013 (lock, history-dependent)"
  - "THINC/BVD (Sun, Inaba, Xiao 2016); parent c-2ca8842812"
