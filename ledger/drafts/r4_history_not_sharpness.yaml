lens: contrarian
statement: >-
  The textbook assumption broken here (and H-0019's mechanism) is that sharp steady shocks give staircase-like
  objectives. The claim is instead that c-2ca8842812's NF3 roughness (p90 0.0765) comes from switching that is
  discontinuous and depends on history, not from sharpness: a discrete BVD argmin, plus a flip-count lock whose final
  pattern depends on the pseudo-time path. Take the same componentwise THINC/BVD (beta 1.6, primitive variables, all
  fields), replace the argmin by a C1 weight of the normalised BVD margin, and keep no memory (state passed through).
  This keeps the RF1 shock median <= 2.6 and reaches NF3 roughness p90 <= 0.002 with NF1 Newton 1.00.
mechanism: >-
  (1) Steady sharpness does not decide roughness. On dev N1 the steady shock is 0.86-0.91 cells wide in four schemes:
  muscl_van_leer 0.907 (r-20261024-152923-ddbf), weno5z 0.901 (r-20261024-152923-3b0e), c-a411e8accb 0.864
  (r-20261023-174118-dde8) and c-2ca8842812 0.903 (r-20261023-034337-d53f). Their N4 roughness spans 1.27e-5 to 0.0109,
  a factor of 860, with every N4 point converged. On promo, weno5z (C-infinity weights) has RF1 shock 2.35 and NF3
  roughness median 4.3e-4. Its p90 of 22 comes from sweep points where Newton did not converge (NF3 converged_impl
  worst 0.91, r-20261024-154023-7489).

  (2) Smoothness of the scheme gives smoothness of J. If R(U, p_b) is C1 in U and dR/dU is nonsingular along the
  sweep, the implicit function theorem makes U(p_b), and so J(p_b), C1. The second difference over the 11-point sweep
  then behaves like the exact one. A discrete argmin makes R only piecewise smooth: U(p_b) jumps wherever a cell near
  the shock crosses a TBV tie, and as p_b moves the shock through the cells, ties are crossed about once per cell.
  That is a staircase, and the second difference amplifies its steps.

  (3) The lock adds dependence on the path. Which cells are locked to MUSCL at convergence depends on the transient
  from the fixed initial guess, and the transient differs between neighbouring p_b. Neighbouring sweep points
  therefore converge to different discrete schemes, which adds noise that is uncorrelated between points. On dev,
  thinc_bvd without the lock has N4 roughness 4.6e-4 (r-20261023-035530-454a, v1.4); c-2ca8842812 with the lock has
  0.0109 (r-20261023-034337-d53f), 24 x more, with all N4 points converged.

  (4) Newton: a C1 weight makes the Jacobian continuous. The discrete thinc_bvd has NF1 Newton 0.65 and NF3 converged
  median 0.27 (r-20261024-154009-f309). The round-3 smooth BVD weights reached NF1 Newton 1.00 (c-a411e8accb,
  r-20261023-232730-c8f5), though only on the entropy field. Evidence against: smoothing superbee's and MC's kinks did
  not restore convergence (H-0001, H-0002).

  Recipe: m = (TBV_M - TBV_T) / (TBV_M + TBV_T + relative tiny), w = (1 + tanh(m / tau)) / 2 with tau in
  {0.05, 0.1, 0.2}, face = w THINC + (1 - w) MUSCL-van-Leer. Use the zoo v1.5 relative monotonicity threshold and a
  positivity fallback (traps). The state is returned unchanged.
