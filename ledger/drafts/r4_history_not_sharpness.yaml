kill_criterion: >-
  Dev (judge v1.5): refuted if, for every tau in {0.05, 0.1, 0.2}, the stateless C1 candidate has N4 roughness > 0.002
  while N4 converged_impl = 1. Non-convergence is then excluded as the cause, so the scheme is rough although smooth
  and memoryless. Also refuted if every tau that reaches N4 <= 0.002 has R1 shock > 2.7: smoothness bought with width
  is what H-0019 says. Controls on dev, to attribute the effect: tau = 1e-4 (nearly discrete, no memory) and the
  EPS-fixed c-2ca8842812 (discrete, with the lock). Promo (judge v1.5): refuted if the best dev tau has an ok promo run
  with RF1 shock_width median > 2.6, or with NF3 roughness p90 > 0.002 while NF3 converged_impl mean = 1.00 (rough
  despite converging is H-0019's mechanism). If NF3 roughness p90 > 0.002 and NF3 converged_impl < 1.00, the verdict is
  inconclusive: Newton failed, as with weno5z, rather than the objective being rough.
