kill_criterion: >-
  Control first: the same file with w = 0 must reproduce the EPS-fixed base's dev scores to 1e-6 relative; otherwise
  the comparison is void. Dev (judge v1.5): refuted if no d0 in {0.02, 0.05, 0.1} reaches R1 shock <= 2.7 (the dev
  proxy for A1) together with N1 converged_impl = 1 and N4 roughness <= 0.002. Also refuted if the best such variant
  has N4 roughness above 10 x the base's 1.27e-5 (r-20261023-174118-dde8, v1.4): then the fixed point is not the
  base's and the mechanism is wrong, even if A5 still holds. Promo (judge v1.5): refuted if the best dev variant has an
  ok promo run with RF1 shock_width median > 2.6, NF3 roughness_J p90 > 0.002 or NF1 converged_impl mean < 1.00. A promo
  run rejected for a hard-constraint violation leaves the promo part inconclusive. A7 misses do not refute the
  mechanism; they are reported against the bounds above.
known_relatives:
  - "time-dependent artificial-viscosity switches in SPH: Morris and Monaghan (1997); Cullen and Dehnen (2010), who use a time derivative as the shock indicator. Here a time difference switches compression on rather than viscosity"
  - "entropy viscosity (Guermond, Pasquetti, Popov 2011): dissipation from a residual that contains the time derivative and vanishes for smooth steady states"
  - "limiter freezing (Venkatakrishnan 1993/1995), zoo muscl_van_leer_frozen; H-0006 (ratchet); H-0007 (settle-freeze, refuted: it froze the sharp scheme, so its fixed point depended on the history)"
  - "base c-a411e8accb (round 3, H-0012 island); H-0012 = characteristic THINC on the entropy field (Chamarthi 2024)"
  - "one web search found no reconstruction that switches compression from the per-step change of the cell values; this is not evidence of novelty"
