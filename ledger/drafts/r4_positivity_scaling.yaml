arena: euler1d
slot: reconstruction_stateful
lens: structure preservation
statement: >-
  Scale each cell's two reconstructed face states towards the cell average, in conserved variables, with one factor
  t in [0, 1] per cell. Choose t as the largest value for which both faces keep rho >= eps rho_bar and
  p >= eps p_bar. Applied to c-a411e8accb, this removes every hard-constraint violation of the characteristic family:
  LF1 1 of 5 on promo, and the round-3 breakers' crashes on cold collisions (B-0016) and strong double rarefactions
  (B-0030), both in v1.5 dev. No Target A promo metric changes by more than 2 %, because t = 1 (no change) wherever both
  face states are already admissible.
mechanism: >-
  Structure: the admissible set G = {rho > 0, p > 0} is convex in conserved variables, because p is concave in U. The
  cell average U_bar lies in G, so the segment from U_bar to a face state stays in G up to its first boundary
  crossing. Scaling towards U_bar is the smallest change that restores admissibility (Zhang and Shu 2010). With
  p >= eps p_bar, t solves a quadratic in closed form; the density condition is linear.

  Why the characteristic family breaks it: face states are built from separately limited characteristic amplitudes and
  mapped back with the centre cell's eigenvectors. Nothing keeps the resulting face rho and p positive when one
  amplitude is large compared with rho or p / a^2, as in cold states (p <= 1e-4) or strong rarefactions. Three
  round-3 breakers named this back-projection as the common cause (docs/rounds/2026-10-23-round3/breaker/).

  HLLC with Einfeldt speeds keeps a first-order update positive for admissible face states (Einfeldt et al. 1991;
  Batten et al. 1997), so admissible face states remove the source of the failure. Stated plainly: full positivity of
  a second-order update also needs U_bar to be a convex combination of the face states and a reduced CFL (Perthame and
  Shu 1996). A nonlinear THINC reconstruction does not satisfy that, so the claim at the judge's CFL 0.5 (local 0.8
  in pseudo-time) is empirical.

  Why it should cost nothing: using one t per cell keeps the cell's two faces consistent, and t = 1 exactly on all
  states away from the bounds. Nozzles, Riemann problems at ordinary pressures and smooth waves therefore run
  bitwise as the parent. The min makes t only C0, but it never acts on the nozzle families, so Newton is unaffected.

  Implementation: eps is relative (eps in {1e-3, 0.05}), so it passes the v1.5 scaling constraint. Every sqrt and
  division is guarded inside jnp.where (traps: Newton needs finite derivatives). The candidate is stateless and passes
  s through. Assumption: c-a411e8accb's LF1 violation is a positivity failure; this was not diagnosed. Kill clause (b)
  below covers the other case.
