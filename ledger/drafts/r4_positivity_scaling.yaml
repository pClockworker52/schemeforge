kill_criterion: >-
  The control is the same parent with only the v1.5 relative-EPS fix. Comparisons are against the control's promo run
  if that run is ok. Otherwise they are against c-a411e8accb's v1.4 promo r-20261023-232730-c8f5, with 5 % instead of
  2 % tolerance for the judge-version change. Refuted if (a) the scaled candidate is rejected on v1.5 dev for a
  non-finite or non-positive state on any case, B-0016 and B-0030 included; or (b) its promo run is rejected for a
  hard-constraint violation in any family; or (c) any of RF1 shock and contact median, RF1 and RF2 overshoot p90, NF1
  converged_expl and converged_impl mean, or NF3 roughness p90 (absolute tolerance 1e-6) differs from the reference by
  more than the tolerance; or (d) its dev scores on the 18 cases from before v1.5 differ from the control's by more
  than 1e-8 relative, which would mean the scaling acts where it should not.
known_relatives:
  - "Known method, stated plainly: the Zhang and Shu (2010, J. Comput. Phys. 229) positivity-preserving scaling towards the cell average, applied here to a characteristic reconstruction; label at most 'rediscovery / variant of Zhang-Shu'"
  - "Perthame and Shu (1996): positivity of MUSCL-type schemes from admissible face states under a reduced CFL"
  - "Einfeldt, Munz, Roe, Sjogreen (1991) and Batten, Clarke, Lambert, Causon (1997): positivity of HLLE/HLLC with Einfeldt speeds"
  - "Hu, Adams, Shu (2013): positivity-preserving flux limiting"
  - "traps file, 'Guard positivity'; round-3 breaker reports (B-0016, B-0017, B-0026..B-0028, B-0030, B-0031, B-0034)"
