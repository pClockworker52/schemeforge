kill_criterion: >-
  Dev (judge v1.5): refuted if no z0 in {2, 3, 5} gives R1 shock <= 2.7 together with B-0010 overshoot <= 0.0274
  (= 1.1 x muscl_van_leer 0.0249, r-20261024-152923-ddbf). Also refuted if, at the z0 with the narrowest R1 shock,
  B-0010 overshoot is more than 10 % above the base's 0.0204 (r-20261023-174118-dde8, v1.4): the strength gate would
  then not spare strong shocks. Promo (judge v1.5): refuted if the best dev variant has an ok promo run with RF1
  shock_width median > 2.6 or RF2 overshoot p90 > 0.0256. If A1 and A7b hold but NF3 roughness p90 > 0.002 or NF1
  converged_impl < 1.00, the steady part is refuted; that is evidence for H-0019's mechanism on compressed steady shocks.
  A promo run rejected for a hard-constraint violation leaves the promo part inconclusive.
known_relatives:
  - "Harten's artificial compression method (1977/1978); Yang (1990), artificial compression for ENO"
  - "PPM flattening (Colella and Woodward 1984): a similar detector (relative pressure jump plus compression) used the other way round, to flatten strong shocks"
  - "viscous shock structure: width inversely proportional to strength (Taylor 1910; textbook)"
  - "post-shock oscillations of strong or slowly moving shocks (Arora and Roe 1997; Jin and Liu 1996)"
  - "local characteristic limiting (Harten, Engquist, Osher, Chakravarthy 1987)"
  - "THINC/BVD (Sun, Inaba, Xiao 2016) and BVD variants for shocks (Deng et al.)"
  - "H-0011 (sharpness forces overshoot for componentwise phi(r)); H-0012 (acoustic fields deliberately left uncompressed); H-0015 (steeper THINC, more overshoot on B-0010)"
