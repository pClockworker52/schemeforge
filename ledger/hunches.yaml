- id: H-0014
  arena: euler1d
  slot: reconstruction_stateful
  lens: structure preservation
  statement: Blend the sharp thinc_bvd reconstruction towards MUSCL-van Albada with a weight given by the entropy
    production of the local Riemann problem. That production is exactly zero for smooth isentropic flow, contacts
    and rarefactions, and third order in shock strength at compressive jumps. The blend should cut post-shock overshoot
    to van Leer's level and let the steady shock converge, while contacts and smooth waves keep thinc_bvd's accuracy.
  mechanism: 'The entropy inequality is what tells physical dissipation apart from numerical artefact. The exact
    solution produces entropy only inside shocks; contacts and smooth waves carry entropy without producing it.
    So dissipation should go only where the local Riemann problem would produce entropy. Recipe (stateless, s passed
    through): for each pair of neighbouring cells in the window, take the relative pressure jump pi = |p_R - p_L|
    / min(p_L, p_R). Gate it by compression with g = smooth step of (u_L - u_R) / a_mean, which is 1 for converging
    flow and 0 for diverging flow. The weak-shock law gives the entropy jump, ds / c_v ~ (gamma^2 - 1) / (12 gamma^2)
    pi^3. The cell weight is theta = P / (P + kappa^3), with P = g pi^3 the largest such value over the cell''s
    two interfaces. Faces are (1 - theta) THINC/BVD + theta MUSCL-van Albada. This cubic sensor separates the cases
    by orders of magnitude: in smooth flow pi = O(dx), so theta = O(dx^3 / kappa^3) and S1, B-0002 and LF2 are untouched.
    S1 even has pi = 0 exactly, because only rho varies. At a contact pi = 0, so contacts stay THINC-sharp (A2,
    A8a). Rarefactions are expanding (g = 0). Only shocks get theta near 1. There the blend removes thinc_bvd''s
    compression from the 1-2 cells whose intermediate states produce the post-shock oscillation (A7), and replaces
    the discrete BVD switch at the steady shock with a smooth limiter (A3, A4). The cost is a wider shock, partly
    offset by self-steepening (A1 is at risk).'
