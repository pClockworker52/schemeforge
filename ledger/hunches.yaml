- id: H-0024
  arena: euler1d
  slot: reconstruction_stateful
  lens: transfer
  statement: 'Transfer Barter and Darmofal''s PDE-based artificial viscosity to the BVD weight. Their method uses
    a non-smooth shock sensor as the forcing of a screened diffusion equation that is solved alongside the flow.
    Here the state carries a weight field per cell and variable. Each step applies one Jacobi sweep of (1 + 2 kappa)
    s_i - kappa (s_{i-1} + s_{i+1}) = f_i, where f_i is the pointwise BVD preference, and the faces use s_i THINC
    + (1 - s_i) MUSCL. With this, c-2ca8842812''s componentwise THINC/BVD converges with Newton on every NF1 nozzle
    and NF3 sweep point and reaches NF3 roughness p90 <= 0.002, with RF1 shock median <= 2.6. The spatial spreading
    removes the staircase, not the pointwise smoothness of the weight: the same forcing without spreading (kappa
    = 0) stays rough.'
  mechanism: 'Source: Barter and Darmofal (2010) found that element-wise, non-smooth artificial viscosity causes
    oscillations that pollute the flow downstream. Smoothing the viscosity field with a PDE removed this and made
    results less sensitive to how the shock is aligned with the grid (Barter''s thesis, 2008).

    How it maps here: c-2ca8842812''s weight changes from 0 to 1 within the one or two cells next to the steady
    shock. So the scheme the shock sees changes whenever the shock moves by part of a cell, and the family of discrete
    steady shocks is not invariant under sub-cell shifts. J(x_s) then picks up a component that repeats every cell.
    The NF3 sweep points are several cells of shock travel apart, so this component aliases into the second difference
    as noise. If the weight is spread over about L ~ 2 sqrt(kappa) cells, moving the shock by one cell changes the
    nearby weight by O(1/L). The scheme around the shock is then nearly the same at every sub-cell position.

    Convergence side: the weight is a state, so it is fixed within a step, in all RK stages and in the Newton Jacobian.
    Newton therefore solves a fixed, smooth blend at each step, with no switch inside the Jacobian; this is the
    relay removal H-0013 tried with its lock. For fixed W, the weight field converges linearly to the unique solution
    of the screened equation (Jacobi factor <= 2 kappa / (1 + 2 kappa)). The weight has no memory beyond that relaxation,
    unlike H-0013''s lock. The forcing f is the BVD choice as a steep sigmoid (width 0.02 in the normalised margin).
    Spreading divides the effect of a flip of f_i on s_i by 1 + 2 kappa.

    Unsteady runs: one sweep per step moves the weight front about one cell per step, faster than a shock at CFL
    0.5 (<= 0.5 cell per step), so the weight keeps up. The spread puts THINC into 1-2 smooth monotone cells beside
    a jump; the RF1 l1_smooth guard watches that cost.

    Window check: s_new_i needs f_i (cells i-2..i+2) and s_{i-1}, s_{i+1}, all inside the window in which cell i
    is left of the interface.

    This hunch competes with the contrarian hunch on the same parent, which says a pointwise C1 weight is enough.
    The kappa = 0 control separates the two.'
