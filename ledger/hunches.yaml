- id: H-0017
  arena: euler1d
  slot: reconstruction_stateful
  lens: approximation theory
  statement: Adding an unlimited third-order (kappa = 1/3) quadratic candidate to thinc_bvd's BVD choice, which
    then picks the smallest total boundary variation among {quadratic, THINC, van Leer MUSCL}, raises the smooth-wave
    order to about 3 on S1, B-0002 and LF2. It keeps thinc_bvd's shock and contact widths and does not add overshoot,
    because an oscillating polynomial has the larger boundary variation and loses the selection.
  mechanism: 'View BVD as a nonlinear approximation scheme: per cell it picks, from a small dictionary of profiles,
    the one whose face values best match the neighbours'' (minimal TBV). Accuracy in a function class is then set
    by the best dictionary member for that class. thinc_bvd''s dictionary has a step (THINC, exact for a jump at
    any sub-cell position) but only a TVD-limited linear profile for smooth data. Its face values are second-order
    accurate, and at smooth extrema the limiter sets the slope to 0, so the scheme drops to first order locally.
    Both effects keep the L1 order at or below 2 (thinc_bvd S1 1.96; c-b5cb82a0ef 0.13 with a flatter limiter).
    The 6-cell window rules out a larger stencil: the TBV of cell k+2 needs the faces of cells k+1 and k+3, so each
    candidate may use only 3 cells. Within it, the unlimited kappa = 1/3 quadratic, q_(i+1/2) = q_i + (2 (q_(i+1)
    - q_i) + (q_i - q_(i-1))) / 6 and q_(i-1/2) = q_i - (2 (q_i - q_(i-1)) + (q_(i+1) - q_i)) / 6, gives third-order
    face values with no clipping at extrema. On smooth data its boundary jumps are O(dx^3), against O(dx^2) for
    the linear MUSCL profile, so BVD selects it there. At a jump its overshooting faces give a TBV of O(jump), while
    THINC''s TBV is near zero, so THINC is selected. van Leer MUSCL stays as a third candidate, so each cell''s
    selected TBV, computed as in thinc_bvd with the same candidate in the neighbours, is no larger than thinc_bvd''s.
    That limits the room for new overshoot. Constant data give zero increments for all three candidates. The candidate
    is stateless and passes s through.'
