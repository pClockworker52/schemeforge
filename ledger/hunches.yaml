- id: H-0015
  arena: euler1d
  slot: reconstruction_stateful
  lens: contrarian
  statement: Contrary to the textbook remedy (more dissipation at the shock) and to the round-2 / H-0011 pattern
    (sharper means more overshoot), a steeper step-like THINC reconstruction makes moving shocks both narrower and
    less oscillatory. For the THINC/BVD family, R6 and B-0010 overshoot falls as the THINC steepness beta rises
    from 1.6 to 3, and some beta reaches van Leer's overshoot with a shock narrower than 2.5 cells.
  mechanism: 'The broken assumption: post-shock overshoot is the price of sharpness, so the cure is added dissipation
    (Roberts 1990; Jin and Liu 1996; round-2 lesson 1; H-0011). The contrarian reading: the overshoot behind a moving
    or slowly moving shock is generated by the intermediate cells inside the numerical shock. Their states lie off
    the physical Hugoniot (Zaide and Roe: on the non-physical branch for Godunov- and Roe-type solvers), and their
    fluxes pulse each time the shock crosses a cell (Arora and Roe 1997; Stiriba and Donat 2003). The oscillation
    therefore scales with how many intermediate states the shock holds and how much they move per crossing. A TVD
    limiter sharpens by a compressive plateau. That keeps 2-3 intermediate cells and steepens their pulsation, hence
    H-0011''s coupling of A1 and A7. A THINC profile with large beta represents the jump as a step at a sub-cell
    position set by the cell average. Both face values of the shock cell are then close to the pre- and post-shock
    states, the shock holds about one intermediate cell, and that cell''s flux varies smoothly as the step crosses
    it. Fewer and better-behaved intermediate states should give a smaller overshoot. Test family (stateless, s
    passed through): thinc_bvd with beta in {1.6, 2.2, 3.0}, plus THINC wherever the cell is monotone between its
    neighbours (no BVD) at the same betas. The face formulas already clip frac away from 0 and 1, which keeps the
    derivatives Newton needs finite.'
