- id: H-0013
  arena: euler1d
  slot: reconstruction_stateful
  lens: steady-convergence
  statement: thinc_bvd's explicit stall on N5/N6 comes from the per-cell BVD choice chattering at near-ties. A state
    that counts how often a cell's choice alternates, locks the cell to MUSCL once it has flipped often enough within
    a decaying window, and releases it only when the BVD margin becomes decisive again converges on the nozzles
    like MUSCL. At the same time it leaves moving discontinuities and long runs at thinc_bvd's sharpness, because
    transport flips a choice a few times and a limit cycle flips it indefinitely.
  mechanism: 'BVD picks, per cell and variable, the candidate with the smaller total boundary variation, a discontinuous
    function of the data. Near a tie (TBV_THINC close to TBV_MUSCL), a small change of the intermediate shock cell
    flips the choice and moves the face values by O(jump). This is a relay without hysteresis, the textbook source
    of chattering in switched systems (sliding-mode control) and a plausible source of the N5/N6 limit cycle. The
    stall signature is frequency, not time. A passing wave flips a cell''s choice once or twice (into THINC and
    back out); a limit cycle flips it every period. The state stores, per cell and variable, s = sign(m_prev) (1
    + c), where m is the normalised BVD margin (TBV_M - TBV_T) / (TBV_M + TBV_T + tiny), m_prev is its sign at the
    last step, and c is a flip score updated as c <- lambda c + [sign(m) != sign(m_prev), both non-zero]. s = 0
    at the start means no history. When c >= S* the cell is locked: it uses MUSCL (van Leer) and c stops decaying.
    It is released only when |m| > mu, a decisive preference that an oscillating near-tie does not reach and an
    arriving wave does. Two traps are avoided by construction. First, flat cells have TBV_M = TBV_T = 0, so m =
    0 and they never count as flipping; the round-2 lock-in of constant regions (traps file, B-0001..B-0008) cannot
    occur. Second, nothing is triggered by a step count K0, so the memory acts from the first steps of a stall and
    does nothing in runs that do not chatter. The candidate differs from earlier memory hunches. H-0006 is time-triggered,
    one-way and takes a minimum. H-0007 freezes cells that have settled, the opposite trigger. H-0008 is a dead
    band on a continuous factor. H-0005 is relaxation. None of them counts alternations or releases on a decisive
    margin.'
