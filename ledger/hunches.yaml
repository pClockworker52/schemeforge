- id: H-0010
  arena: euler1d
  slot: limiter_stateful
  lens: structure preservation
  statement: Relaxing the limiter towards superbee's value in pseudo-time but clipping it to Sweby's TVD region
    at every step (phi_used = clip(s + w (phi_sb(r) - s), 0, min(2r, 2))) keeps the unsteady runs TVD and oscillation-free,
    unlike unclipped relaxation, and still breaks the explicit limit cycle.
  mechanism: Relaxation lags behind a moving discontinuity, so the lagged phi can leave the TVD region (overshoot).
    Clipping to max(0, min(2r, 2)) restores the TVD bound pointwise at every step, while the filtered value inside
    the region still damps chatter at a steady shock. The state stores the clipped phi.
  predicted_effect:
