    size: dev, finite and positive (B-0016 and B-0030 both crash the zoo thinc_bvd, v1.5 dev r-20261024-152919-1578)
  - metric: RF1.shock_width
    direction: same
    size: median within 2 % of the control (c-a411e8accb promo 2.888, r-20261023-232730-c8f5); RF1 contact 3.007
      likewise
  - metric: NF3.roughness_J
    direction: same
    size: p90 within 2 % or 1e-6 absolute of the control (c-a411e8accb 1.47e-5)
  - metric: NF1.converged_impl
    direction: same
    size: 1.00 (c-a411e8accb 1.00); NF1 explicit 0.95 unchanged
  - metric: RF2.overshoot
    direction: same
    size: p90 within 2 % of the control (c-a411e8accb 0.0236); RF1 p90 0.0066 likewise
  kill_criterion: The control is the same parent with only the v1.5 relative-EPS fix. Comparisons are against the
    control's promo run if that run is ok. Otherwise they are against c-a411e8accb's v1.4 promo r-20261023-232730-c8f5,
    with 5 % instead of 2 % tolerance for the judge-version change. Refuted if (a) the scaled candidate is rejected
    on v1.5 dev for a non-finite or non-positive state on any case, B-0016 and B-0030 included; or (b) its promo
    run is rejected for a hard-constraint violation in any family; or (c) any of RF1 shock and contact median, RF1
