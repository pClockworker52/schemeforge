[project]
name = "schemeforge"
version = "0.1.0"
description = "AI-swarm search for numerical scheme components, judged by exact solutions."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "scipy>=1.13",
    "sympy>=1.13",
    "typer>=0.12",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "mcp>=1.2",
]

[project.optional-dependencies]
# Arena 2 (third-medium contact) judge; pinned: felupe 12 removes the callback API (docs/plans/2026-10-30-phase6.md D3)
contact = ["felupe==11.3.0", "tensortrax==0.30.0"]  # tensortrax: felupe.constitution.jax imports it

[project.scripts]
sforge = "schemeforge.cli:app"
sforge-mcp = "schemeforge.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemeforge"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["candidates", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# candidate files kept as round records are registered by code hash and must stay byte-identical
per-file-ignores = { "docs/**" = ["E501"], "scripts/spikes/**" = ["E", "F", "I", "B", "UP", "SIM"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
